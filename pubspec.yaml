name: supermarket
description: A new Flutter project.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  easy_localization: 3.0.8
  flutter_spinkit: 5.2.2
  get_it: 9.2.0
  bloc: 9.1.0
  flutter_bloc: 9.1.1
  connectivity_plus: ^6.1.3
  equatable: 2.0.7
  dio: 5.9.0
  dartz: 0.10.1
  intl: ^0.20.2
  flutter_svg: ^2.2.1
  flutter_secure_storage: 10.0.0
  shared_preferences: ^2.5.3
  email_validator: ^3.0.0
  font_awesome_flutter: ^10.8.0
  pretty_dio_logger: ^1.4.0
  intl_phone_field: ^3.2.0
  google_sign_in: ^6.3.0
  flutter_dotenv: 6.0.0
  injectable: 2.7.1+2
  json_annotation: ^4.9.0
  go_router: 17.0.1
  searchfield: ^1.4.0
  retrofit: 4.9.1
  banner_carousel: ^1.2.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.7.1
  json_serializable: 6.11.2
  injectable_generator: 2.8.1
  flutter_gen: 5.11.0
  flutter_gen_runner: 5.11.0
  retrofit_generator: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Andale
      fonts:
        - asset: assets/fonts/AndaleMono.ttf
  assets:
    - assets/images/
    - assets/translations/
    - .env

flutter_gen:
  output: lib/core/presentation/utils/generated/generated_assets/
  integrations:
    flutter_svg: true
